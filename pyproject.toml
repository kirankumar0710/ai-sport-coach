[project]
name = "ai-sport-coach"
version = "0.1.0"
description = "Multi-agent AI Sports Coach on a provider-agnostic agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0",
    # LiteLLM bridges ADK to non-Gemini providers (Anthropic, OpenAI, ...)
    "litellm>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sport-coach = "sport_coach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
