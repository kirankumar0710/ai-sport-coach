# AI Sports Coach configuration.
#
# Secrets never live here. Each provider names the environment variable that
# holds its key; export it from your shell, e.g.
#   export PROVIDER=gemini
#   export GEMINI_API_KEY=...
#
# The PROVIDER env var overrides `llm.default_provider`.
# The MODEL env var (optional) overrides the selected provider's model.

[app]
name = "AI Sports Coach"
data_dir = "data/workouts"   # relative to the project root
usage_db = "data/usage.db"   # LLM call log for the Admin tab (counts only, no workout data)

[llm]
default_provider = "gemini"

# Generation parameters shared by all providers (per-provider values below win).
temperature = 0.3
max_output_tokens = 2048

# Each vendor's adapter lives in sport_coach/providers/<vendor>.py and knows that
# vendor's defaults (e.g. Anthropic sends no temperature). Per provider you can
# override with:  supports_temperature = true | false

[llm.providers.gemini]
model = "gemini-3.8-flash"
api_key_env = "GEMINI_API_KEY"

[llm.providers.anthropic]
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[llm.providers.openai]
model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"
# base_url = "https://api.openai.com/v1"   # optional: proxies / compatible endpoints

# Model prices for cost tracking (USD per 1 million tokens). Usually not needed:
# prices come from LiteLLM's current price list automatically. Entries here
# override it, e.g. for negotiated rates or a model the list doesn't know yet.
# Each call is priced when it happens and the cost is stored with it.
[pricing]
# "gemini-3.8-flash"  = { input = 0.00, output = 0.00 }
# "claude-sonnet-5-5" = { input = 0.00, output = 0.00 }
# "gpt-4.1"           = { input = 0.00, output = 0.00 }
